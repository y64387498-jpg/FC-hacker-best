
name: FC Power Shot APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build FC Power Shot APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Components
        run: |
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Find Project
        run: |
          FILE=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Android project missing!"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FC-PowerShot-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
